<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Control Personal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            🎯
            <span>Control Personal</span>
        </div>

        <nav>

            <button class="nav-item activo">
                🏠 <span>Hoy</span>
            </button>

            <button class="nav-item">
                📅 <span>Horario</span>
            </button>

            <button class="nav-item">
                ✅ <span>Hábitos</span>
            </button>

            <button class="nav-item">
                📊 <span>Progreso</span>
            </button>

            <button class="nav-item">
                🎯 <span>Metas</span>
            </button>

            <button class="nav-item">
                ⚙️ <span>Configuración</span>
            </button>

        </nav>

    </aside>


    <main class="contenido">

        <header>

            <div>

                <p class="fecha" id="fecha">
                    Cargando...
                </p>

                <h1>
                    Mi día
                </h1>

            </div>

            <div class="racha">
                🔥 <strong>0</strong> días
            </div>

        </header>


        <section class="progreso">

            <div class="progreso-info">

                <span>
                    Progreso de hoy
                </span>

                <strong>
                    0%
                </strong>

            </div>

            <div class="barra">

                <div
                    class="barra-progreso"
                    style="width: 0%"
                ></div>

            </div>

        </section>


        <section class="actividad">

            <span class="etiqueta">
                AHORA
            </span>

            <div class="actividad-principal">

                <div
                    class="actividad-icono"
                    id="actividadIcono"
                >
                    ⏳
                </div>

                <div>

                    <h2 id="actividadNombre">
                        Cargando...
                    </h2>

                    <p id="actividadCategoria">
                        --
                    </p>

                    <span id="actividadHorario">
                        --:-- - --:--
                    </span>

                </div>

            </div>


            <div
                class="temporizador"
                id="temporizador"
            >
                00:00:00
            </div>


            <div class="acciones">

                <button
                    class="btn completar"
                    id="completar"
                >
                    ✓ Completar
                </button>

                <button
                    class="btn iniciar"
                    id="iniciar"
                >
                    ▶ Iniciar
                </button>

            </div>

        </section>


        <section class="siguiente">

            <span class="etiqueta">
                SIGUIENTE
            </span>

            <div class="siguiente-contenido">

                <span id="siguienteNombre">
                    Cargando...
                </span>

                <strong id="siguienteHora">
                    --:--
                </strong>

            </div>

        </section>

    </main>


    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>

</html>
